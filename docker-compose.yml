services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_universitaria_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      # - CORS_ALLOWED_ORIGINS=http://localhost:5173
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - tienda_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tienda_universitaria_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobreescribir los node_modules del contenedor con los locales si existen
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - tienda_network

networks:
  tienda_network:
    driver: bridge
